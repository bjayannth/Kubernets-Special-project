apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-frontend
  namespace: cloudops-system
  labels:
    app: cloudops-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudops-frontend
  template:
    metadata:
      labels:
        app: cloudops-frontend
    spec:
      containers:
      - name: cloudops-frontend
        image: cloudops-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-frontend
  namespace: cloudops-system
spec:
  selector:
    app: cloudops-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: NodePort

