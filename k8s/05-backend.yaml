apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-backend-sa
  namespace: cloudops-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudops-backend-role
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces", "events", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudops-backend-binding
subjects:
- kind: ServiceAccount
  name: cloudops-backend-sa
  namespace: cloudops-system
roleRef:
  kind: ClusterRole
  name: cloudops-backend-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-backend
  namespace: cloudops-system
  labels:
    app: cloudops-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudops-backend
  template:
    metadata:
      labels:
        app: cloudops-backend
    spec:
      serviceAccountName: cloudops-backend-sa
      containers:
      - name: cloudops-backend
        image: cloudops-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PORT
          value: "5000"
        - name: MARKET_SERVICE_URL
          value: "http://market-data-service.cloudops-system.svc.cluster.local:4000"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-backend
  namespace: cloudops-system
spec:
  selector:
    app: cloudops-backend
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  type: ClusterIP

